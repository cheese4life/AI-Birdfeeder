<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Birdhouse{% endblock %}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #ccc; font-family: monospace; font-size: 14px; }
a { color: #ccc; text-decoration: none; }
a:hover { color: #fff; }
nav { display: flex; gap: 24px; padding: 16px 24px; border-bottom: 1px solid #333; align-items: center; }
nav a { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
nav a.active { color: #fff; border-bottom: 1px solid #fff; }
.status-dot {
  width: 12px; height: 12px; border-radius: 50%; border: 2px solid #444;
  background: transparent; margin-left: auto; transition: all 0.3s;
}
.status-dot.detected { background: #22cc22; border-color: #22cc22; box-shadow: 0 0 8px #22cc2266; }
.status-dot.processing { background: #cc8800; border-color: #cc8800; }
.status-dot.uploading { background: #4488cc; border-color: #4488cc; }
.status-label { color: #555; font-size: 11px; margin-left: 8px; text-transform: uppercase; letter-spacing: 1px; }
.container { padding: 24px; }
h1 { color: #fff; font-size: 18px; margin-bottom: 16px; font-weight: normal; }
.card { border: 1px solid #333; padding: 16px; margin-bottom: 16px; }
.card img { max-width: 100%; height: auto; }
.label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
.value { color: #fff; font-size: 16px; margin-top: 4px; }
.success { color: #22cc22; }
.error { color: #cc2222; }
.badge { display: inline-block; padding: 2px 8px; font-size: 12px; border: 1px solid; }
.badge.success { border-color: #22cc22; }
.badge.error { border-color: #cc2222; }
select, input { background: #111; color: #ccc; border: 1px solid #333; padding: 8px 12px; font-family: monospace; font-size: 14px; }
select:focus, input:focus { border-color: #888; outline: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.meta { display: flex; gap: 16px; margin-top: 8px; }
.no-data { color: #555; padding: 40px; text-align: center; }
{% block extra_css %}{% endblock %}
</style>
</head>
<body>
<nav>
  <a href="/live" class="{% if active == 'live' %}active{% endif %}">Live</a>
  <a href="/daily" class="{% if active == 'daily' %}active{% endif %}">Daily</a>
  <div class="status-dot" id="status-dot"></div>
  <span class="status-label" id="status-label">idle</span>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<script>
let _prevState = "";
function pollStatus() {
  fetch("/api/status")
    .then(r => r.json())
    .then(s => {
      const state = s.state || "idle";
      if (state === _prevState) return;
      _prevState = state;
      document.getElementById("status-dot").className = "status-dot " + state;
      document.getElementById("status-label").textContent = state;
    }).catch(() => {});
}
pollStatus();
setInterval(pollStatus, 3000);
</script>
</body>
</html>
